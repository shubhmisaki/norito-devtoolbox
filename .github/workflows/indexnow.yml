name: IndexNow
# After each push to main, tell IndexNow-enabled search engines (Bing,
# Yandex, Seznam, Naver) exactly which pages changed, so they recrawl in
# minutes instead of weeks. No secrets needed: the key is public by design
# and is verified against the key file served from the site root.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Resubmit every URL in sitemap.xml"
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Cloudflare to deploy this commit
        run: sleep 120
      - name: Submit changed pages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" = "true" ]; then
            python3 scripts/indexnow.py --all
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            python3 scripts/indexnow.py --all
          else
            git diff --name-only "$BEFORE" "$AFTER" | python3 scripts/indexnow.py
          fi
