    <h1>文字数指定テキストジェネレーター</h1>
    <p class="lede">
      50、100、250、1000など、必要な正確な文字数のダミーテキストを生成します。正確な長さが重要なモックアップ、フォームテスト、デザインプレビューに便利です。
    </p>
    </div>
  </div>

    <div class="two-col">
      <div class="panel">
        <div class="field" style="margin-bottom:14px;">
          <label for="textOutput">生成されたテキスト</label>
          <textarea id="textOutput" class="mono-area" rows="8" readonly placeholder="「生成」をクリックしてダミーテキストを作成してください。"></textarea>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <div style="display:flex; gap:14px; flex-wrap:wrap;">
            <span class="note" id="charCount" style="margin:0;">0文字</span>
            <span class="note" id="wordCount" style="margin:0;">0語</span>
          </div>
          <button id="copyBtn" class="secondary">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
  テキストをコピー
</button>
        </div>
        <div class="result-box" id="result" style="display:none;"></div>
      </div>

      <div>
        <div class="panel">
          <div class="field" style="margin-bottom:14px;">
            <label for="limitInput">文字数</label>
            <input type="number" id="limitInput" value="100" min="1" step="1" />
          </div>
          <div class="field" style="margin-bottom:10px;">
            <label>プリセット</label>
          </div>
          <div class="preset-row" id="presets"></div>
          <div class="option-row" style="margin:16px 0;">
            <div>
              <div class="option-label">スペースを文字数に含める</div>
              <div class="option-hint">オフの場合、目に見える文字のみカウントします(スペースを除く)</div>
            </div>
            <label class="switch"><input type="checkbox" id="optCountSpaces" checked /><span class="track"></span></label>
          </div>
          <button id="generateBtn" style="width:100%;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            生成
          </button>
        </div>
      </div>
